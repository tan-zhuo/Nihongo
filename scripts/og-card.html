<!doctype html>
<!-- OG card source. Regenerate public/og.png with:
  chrome-headless-shell --no-sandbox --headless --window-size=1200,630 --screenshot=public/og.png --hide-scrollbars file://$PWD/scripts/og-card.html -->
<html>
<head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #faf9f6;
    font-family: 'Noto Sans CJK JP', sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
    position: relative;
  }
  .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #b45309; }
  .kicker { font-size: 30px; letter-spacing: 0.35em; color: #b45309; font-weight: 700; margin-bottom: 28px; }
  h1 { font-size: 92px; font-weight: 900; color: #292524; line-height: 1.15; margin-bottom: 30px; }
  .sub { font-size: 33px; color: #57534e; line-height: 1.5; white-space: nowrap; }
  .badges { position: absolute; bottom: 56px; left: 96px; display: flex; gap: 16px; }
  .badge { font-size: 26px; font-weight: 700; color: #78716c; border: 2.5px solid #d6d3d1; border-radius: 999px; padding: 10px 26px; background: #fff; }
  .brand { position: absolute; top: 60px; right: 96px; font-size: 32px; font-weight: 800; color: #292524; }
</style></head>
<body>
  <div class="accent"></div>
  <div class="kicker">日本語タイピング</div>
  <h1>nihongo.ink</h1>
  <div class="sub">Japanese Typing Practice · 日本語タイピング練習 · 日语打字练习</div>
  <div class="badges">
    <span class="badge">JLPT N5–N1</span>
    <span class="badge">52 Articles</span>
    <span class="badge">4,200 Words</span>
    <span class="badge">かな · 文法</span>
  </div>
</body>
</html>
